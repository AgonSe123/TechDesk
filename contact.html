<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ChatDesk</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="page-container">
        <header>
            <nav>
                <div class="logo">
                    <i class="fas fa-robot"></i>
                    <h1>ChatDesk</h1>
                </div>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="chat.html">Live Chat</a>
                    <a href="about.html">About Us</a>
                    <a href="contact.html" class="active">Contact</a>
                    <a href="login.html" class="btn nav-btn">Log In</a>
                </div>
            </nav>
        </header>

        <main class="main-content">
            <div class="contact-container">
                <section class="contact-hero">
                    <h2>Contact CrashOut Crew</h2>
                    <div class="team-email">
                        <p><i class="fas fa-envelope"></i> <a href="mailto:crashoutcrew@gmail.com">crashoutcrew@gmail.com</a></p>
                    </div>
                </section>

                <section class="contact-form-section">
                    <h3>Send a Direct Message</h3>
                    <form id="contactForm" class="contact-form">
                        <div class="form-group">
                            <input type="email" id="email" placeholder=" " required>
                            <label for="email">Your Email</label>
                        </div>
                        <div class="form-group">
                            <input type="text" id="subject" placeholder=" " required>
                            <label for="subject">Subject</label>
                        </div>
                        <div class="form-group">
                            <textarea id="message" placeholder=" " required></textarea>
                            <label for="message">Message</label>
                        </div>
                        <button type="submit" class="btn primary">Send Message</button>
                    </form>
                </section>
            </div>
        </main>

        <footer>
            <div class="footer-content">
                <div class="footer-logo">
                    <i class="fas fa-robot"></i>
                    <h4>ChatDesk</h4>
                    <p>Smarter Support, Instantly</p>
                </div>
                <div class="footer-links">
                    <div class="link-group">
                        <h5>Product</h5>
                        <a href="#features">Features</a>
                        <a href="#integrations">Integrations</a>
                        <a href="#pricing">Pricing</a>
                    </div>
                    <div class="link-group">
                        <h5>Company</h5>
                        <a href="about.html">About Us</a>
                        <a href="#">Careers</a>
                        <a href="contact.html">Contact</a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2023 CrashOut Crew. All rights reserved.</p>
                <div class="social-links">
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-linkedin"></i></a>
                    <a href="#"><i class="fab fa-github"></i></a>
                </div>
            </div>
        </footer>
    </div>

    <script src="scripts/contact.js"></script>
</body>
</html>
