<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ChatDesk</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <i class="fas fa-robot"></i>
                <h1>ChatDesk</h1>
            </div>
            <div class="nav-links">
                <a href="chat.html">Live Chat</a>
                <a href="profile.html" class="active">Profile</a>
                <a href="#" id="logout-btn" class="btn nav-btn">Log Out</a>
            </div>
        </nav>
    </header>

    <main class="profile-container">
        <section class="profile-header">
            <div class="avatar-upload">
                <div class="avatar-preview">
                    <i class="fas fa-user" id="avatar-icon"></i>
                </div>
                <input type="file" id="avatar-upload" accept="image/*">
                <label for="avatar-upload" class="btn secondary">Change Avatar</label>
            </div>
            <div class="profile-info">
                <h2 id="username">Ensar Bexheti</h2>
                <p><i class="fas fa-envelope"></i> <span id="user-email">eb31776@seeu.edu.mk</span></p>
                <p><i class="fas fa-user-tag"></i> <span id="user-role">Admin</span></p>
            </div>
        </section>

        <section class="profile-details">
            <form id="profile-form">
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" value="Ensar Bexheti">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" value="eb31776@seeu.edu.mk">
                </div>
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" placeholder="Leave blank to keep current">
                </div>
                <button type="submit" class="btn primary">Save Changes</button>
            </form>
        </section>

        <section class="activity-log">
            <h3><i class="fas fa-history"></i> Recent Activity</h3>
            <ul id="activity-list">
                <!-- Filled by JavaScript -->
            </ul>
        </section>
    </main>

    <script src="scripts/profile.js"></script>
</body>
</html>
